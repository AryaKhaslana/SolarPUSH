name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ts-and-protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: TypeScript strict check
        run: npm run typecheck
      - name: SMPv1 & geodesy unit tests
        run: npm test
      - name: Verify Expo web bundle export
        run: npm run export:web

  android-apk-build:
    runs-on: ubuntu-latest
    needs: ts-and-protocol-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Prebuild Android native project
        env:
          CI: "1"
        run: npx expo prebuild --platform android
      - name: Run Kotlin SMPv1 & FFT unit tests
        working-directory: android
        run: ./gradlew :sonarmesh-native:testDebugUnitTest
      - name: Build standalone offline APK (release bundle signed with debug keystore)
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace
      - name: Rename standalone APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SonarMesh-offline.apk
      - name: Upload SonarMesh-offline.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonarMesh-offline-apk
          path: SonarMesh-offline.apk
          retention-days: 30
